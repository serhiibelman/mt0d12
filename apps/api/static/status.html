<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>R2D2 Status</title>
<!--
  The rover's live status, fed by /ws/status. One file, plain JavaScript, no
  build step and nothing fetched from a CDN: the rover is often on a network
  without internet, so everything the page needs is served by the Pi itself.
-->
<style>
  :root {
    color-scheme: light dark;
    --bg: #f4f5f7;
    --card: #ffffff;
    --text: #1c1f24;
    --muted: #666d78;
    --line: #dfe2e7;
    --ok: #1f8a4c;
    --warn: #b7791f;
    --bad: #c53030;
    --idle: #8a919c;
    --sky: #7fb3e6;
    --ground: #a8815a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121418;
      --card: #1c1f25;
      --text: #e6e8eb;
      --muted: #9aa1ac;
      --line: #2e323a;
      --ok: #3fbf74;
      --warn: #e0a43a;
      --bad: #f06363;
      --idle: #6f7682;
      --sky: #35618f;
      --ground: #6e5238;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header {
    position: sticky;
    top: 0;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 16px;
    background: var(--card);
    border-bottom: 1px solid var(--line);
  }
  h1 { margin: 0; font-size: 18px; }
  h2 {
    margin: 0 0 10px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .04em;
    text-transform: uppercase;
    color: var(--muted);
  }
  main {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 12px;
    max-width: 1100px;
    margin: 0 auto;
    padding: 16px;
  }
  section {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px 16px;
    min-width: 0;
  }
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    white-space: nowrap;
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--idle); }
  .pill[data-state="live"] .dot { background: var(--ok); }
  .pill[data-state="stale"] .dot,
  .pill[data-state="connecting"] .dot { background: var(--warn); }
  .pill[data-state="disconnected"] .dot { background: var(--bad); }
  .big { font-size: 30px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .unit { font-size: 15px; font-weight: 400; color: var(--muted); }
  dl {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 4px 12px;
    margin: 0;
  }
  dt { color: var(--muted); }
  dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
  .bar { height: 6px; margin: 8px 0 12px; background: var(--line); border-radius: 3px; overflow: hidden; }
  .bar > div { height: 100%; width: 0; background: var(--ok); transition: width .3s; }
  .attitude { display: flex; align-items: center; gap: 16px; }
  .attitude svg { flex: none; width: 110px; height: 110px; }
  .attitude dl { flex: 1; }
  .badge {
    display: inline-block;
    padding: 1px 8px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    color: #fff;
    background: var(--idle);
  }
  .badge.ok { background: var(--ok); }
  .badge.warn { background: var(--warn); }
  .badge.bad { background: var(--bad); }
  .rows > div {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    padding: 6px 0;
    border-top: 1px solid var(--line);
  }
  .rows > div:first-child { border-top: 0; }
  .detail { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { padding: 5px 0; text-align: right; border-top: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 400; border-top: 0; }
  th:first-child, td:first-child { text-align: left; }
  footer { padding: 0 16px 24px; text-align: center; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>R2D2</h1>
  <span class="pill" id="connection" data-state="connecting">
    <span class="dot"></span><span id="connection-text">Connecting…</span>
  </span>
</header>

<main>
  <section>
    <h2>Battery</h2>
    <div class="big"><span id="battery-voltage">—</span> <span class="unit">V</span></div>
    <div class="bar"><div id="battery-bar"></div></div>
    <dl>
      <dt>Remaining</dt><dd id="battery-remaining">—</dd>
      <dt>Current</dt><dd id="battery-current">—</dd>
    </dl>
  </section>

  <section>
    <h2>Attitude</h2>
    <div class="attitude">
      <svg viewBox="-50 -50 100 100" aria-label="Artificial horizon">
        <clipPath id="face"><circle r="48"></circle></clipPath>
        <g clip-path="url(#face)">
          <rect x="-100" y="-100" width="200" height="200" fill="var(--sky)"></rect>
          <g id="horizon">
            <rect x="-100" y="0" width="200" height="100" fill="var(--ground)"></rect>
            <line x1="-100" x2="100" y1="0" y2="0" stroke="#fff" stroke-width="1.5"></line>
          </g>
        </g>
        <circle r="48" fill="none" stroke="var(--line)" stroke-width="2"></circle>
        <path d="M-22 0 H-8 L0 6 L8 0 H22" fill="none" stroke="#fc3" stroke-width="3"></path>
      </svg>
      <dl>
        <dt>Roll</dt><dd id="attitude-roll">—</dd>
        <dt>Pitch</dt><dd id="attitude-pitch">—</dd>
        <dt>Yaw</dt><dd id="attitude-yaw">—</dd>
      </dl>
    </div>
  </section>

  <section>
    <h2>Components</h2>
    <div class="rows" id="components"></div>
  </section>

  <section>
    <h2>Raspberry Pi</h2>
    <dl>
      <dt>CPU temperature</dt><dd id="pi-temp">—</dd>
      <dt>Load (1 min)</dt><dd id="pi-load">—</dd>
      <dt>Memory free</dt><dd id="pi-memory">—</dd>
      <dt>Disk free</dt><dd id="pi-disk">—</dd>
    </dl>
    <div class="chips" id="pi-warnings"></div>
  </section>

  <section>
    <h2>Power &amp; throttling</h2>
    <div class="rows" id="pi-flags"></div>
  </section>

  <section>
    <h2>Motors</h2>
    <table>
      <thead><tr><th>Motor</th><th>RPM</th><th>Current (raw)</th></tr></thead>
      <tbody id="motors"></tbody>
    </table>
  </section>
</main>

<footer id="devices"></footer>

<script>
"use strict";

const WS_URL = `${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws/status`;

// The stream runs at 5 Hz, so one second of silence is five missed updates.
const STALE_AFTER_MS = 1000;
// A dropped Wi-Fi link can leave the socket looking open for a long time; after
// this long without a message it is abandoned and a new one opened.
const DEAD_AFTER_MS = 5000;
const BACKOFF_MIN_MS = 500;
const BACKOFF_MAX_MS = 10000;

const PI_FLAGS = [
  ["undervoltage", "Undervoltage"],
  ["freq_capped", "Frequency capped"],
  ["throttled", "Throttled"],
  ["soft_temp_limit", "Temperature limit"],
];

let socket = null;
let attempt = 0;
let reconnectTimer = null;
let reconnectAt = 0;
// Both per socket: a reconnect starts the clock again.
let socketOpenedAt = 0;
let lastMessageAt = 0;

const $ = (id) => document.getElementById(id);

// -- Connection -------------------------------------------------------------

function connect() {
  clearTimeout(reconnectTimer);
  reconnectTimer = null;
  if (socket) return;

  const ws = new WebSocket(WS_URL);
  socket = ws;
  socketOpenedAt = Date.now();
  lastMessageAt = 0;
  setConnection("connecting", "Connecting…");

  ws.onmessage = (event) => {
    attempt = 0;
    lastMessageAt = Date.now();
    render(JSON.parse(event.data));
  };
  ws.onclose = () => {
    // A socket this page closed on purpose is already forgotten; only an
    // unexpected close schedules a retry.
    if (socket !== ws) return;
    socket = null;
    scheduleReconnect();
  };
}

function disconnect() {
  const ws = socket;
  socket = null;
  if (ws) ws.close();
}

function scheduleReconnect() {
  if (document.hidden) return;
  // Exponential backoff with jitter, so a rover coming back up is not hit by
  // every open tab at the same instant.
  const ceiling = Math.min(BACKOFF_MAX_MS, BACKOFF_MIN_MS * 2 ** attempt);
  const delay = ceiling / 2 + Math.random() * (ceiling / 2);
  attempt += 1;
  reconnectAt = Date.now() + delay;
  reconnectTimer = setTimeout(connect, delay);
  setConnection("disconnected", "Disconnected");
}

function setConnection(state, text) {
  $("connection").dataset.state = state;
  $("connection-text").textContent = text;
}

// Keeps the pill honest between messages: how old the data is, when the next
// retry is, and whether a quiet socket has died.
setInterval(() => {
  const now = Date.now();
  if (reconnectTimer) {
    const seconds = Math.max(0, Math.ceil((reconnectAt - now) / 1000));
    setConnection("disconnected", `Disconnected · retrying in ${seconds}s`);
    return;
  }
  if (!socket) return; // paused

  const quietFor = now - (lastMessageAt || socketOpenedAt);
  if (quietFor > DEAD_AFTER_MS) {
    disconnect();
    scheduleReconnect();
  } else if (!lastMessageAt) {
    // Still connecting; connect() already said so.
  } else if (quietFor > STALE_AFTER_MS) {
    setConnection("stale", `Stale · ${Math.floor(quietFor / 1000)}s old`);
  } else {
    setConnection("live", "Live");
  }
}, 250);

// A hidden tab closes its socket: the rover stops rendering updates nobody
// sees, and its producer stops altogether once no viewer is left.
document.addEventListener("visibilitychange", () => {
  if (document.hidden) {
    clearTimeout(reconnectTimer);
    reconnectTimer = null;
    disconnect();
    setConnection("paused", "Paused");
  } else {
    attempt = 0;
    connect();
  }
});

// -- Rendering --------------------------------------------------------------
// Everything goes in through textContent, never innerHTML, so nothing in a
// status message can turn into markup.

function fmt(value, digits = 0, suffix = "") {
  if (value === null || value === undefined) return "—";
  return `${Number(value).toFixed(digits)}${suffix}`;
}

function yesNo(value) {
  if (value === null || value === undefined) return ["unknown", ""];
  return value ? ["yes", "bad"] : ["no", "ok"];
}

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

function badge(text, tone) {
  return el("span", `badge ${tone}`.trim(), text);
}

function title(key) {
  const words = key.replace(/_/g, " ");
  return words.charAt(0).toUpperCase() + words.slice(1);
}

function render(status) {
  renderBattery(status.battery);
  renderAttitude(status.attitude);
  renderComponents(status.components);
  renderPi(status.pi);
  renderMotors(status.motor_feedback);
  $("devices").textContent =
    `motors ${status.motor_device ?? "—"} · flight controller ${status.fc_device ?? "—"}`;
}

function renderBattery(battery) {
  $("battery-voltage").textContent = fmt(battery.voltage_v, 2);
  $("battery-current").textContent = fmt(battery.current_a, 2, " A");
  $("battery-remaining").textContent = fmt(battery.remaining_percent, 0, "%");

  const bar = $("battery-bar");
  const percent = battery.remaining_percent;
  bar.style.width = percent === null ? "0" : `${Math.max(0, Math.min(100, percent))}%`;
  bar.style.background =
    percent === null ? "var(--idle)" : percent < 20 ? "var(--bad)" : percent < 40 ? "var(--warn)" : "var(--ok)";
}

function renderAttitude(attitude) {
  $("attitude-roll").textContent = fmt(attitude.roll_deg, 1, "°");
  $("attitude-pitch").textContent = fmt(attitude.pitch_deg, 1, "°");
  $("attitude-yaw").textContent = fmt(attitude.yaw_deg, 1, "°");

  // Seen from the rover: rolling right tips the horizon left, pitching up
  // drops it. One degree of pitch moves it one unit, clamped to the dial.
  const roll = attitude.roll_deg ?? 0;
  const pitch = Math.max(-45, Math.min(45, attitude.pitch_deg ?? 0));
  $("horizon").setAttribute("transform", `rotate(${-roll}) translate(0 ${pitch})`);
}

function renderComponents(components) {
  const rows = Object.entries(components).map(([name, component]) => {
    const [text, tone] = !component.configured
      ? ["not configured", ""]
      : component.connected ? ["connected", "ok"] : ["down", "bad"];
    const row = el("div");
    const label = el("div");
    label.append(el("div", "", title(name)), el("div", "detail", component.detail));
    row.append(label, badge(text, tone));
    return row;
  });
  $("components").replaceChildren(...rows);
}

function renderPi(pi) {
  $("pi-temp").textContent = fmt(pi.cpu_temp_c, 1, " °C");
  $("pi-load").textContent = fmt(pi.load_1m, 2);
  $("pi-memory").textContent =
    pi.memory_available_mb === null ? "—" : `${pi.memory_available_mb} MB (${fmt(pi.memory_available_percent, 0, "%")})`;
  $("pi-disk").textContent =
    pi.disk_free_mb === null ? "—" : `${pi.disk_free_mb} MB (${fmt(pi.disk_free_percent, 0, "%")})`;

  const warnings = pi.warnings.length
    ? pi.warnings.map((warning) => badge(title(warning), "bad"))
    : [badge("No warnings", "ok")];
  $("pi-warnings").replaceChildren(...warnings);

  // "now" is the firmware's state at this reading; "since boot" is sticky, so
  // a brownout that has already passed still shows.
  const rows = PI_FLAGS.map(([key, label]) => {
    const [nowText, nowTone] = yesNo(pi[`${key}_now`]);
    const [bootText, bootTone] = yesNo(pi[`${key}_since_boot`]);
    const row = el("div");
    const badges = el("div");
    badges.append(badge(`now ${nowText}`, nowTone), document.createTextNode(" "),
                  badge(`since boot ${bootText}`, bootTone === "bad" ? "warn" : bootTone));
    row.append(el("div", "", label), badges);
    return row;
  });
  $("pi-flags").replaceChildren(...rows);
}

function renderMotors(motors) {
  const rows = motors.map((motor) => {
    const row = el("tr");
    row.append(el("td", "", `#${motor.motor_id}`), el("td", "", fmt(motor.rpm)),
               el("td", "", fmt(motor.current_raw)));
    return row;
  });
  $("motors").replaceChildren(...rows);
}

connect();
</script>
</body>
</html>
